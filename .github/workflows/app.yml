name: app-build
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-build
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platform folders
        run: |
          flutter --version
          flutter create . --platforms=android --org com.bogoch --project-name rami_sales
          rm -rf test
          python3 tool/patch_android.py
      - run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../analyze.log
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} --dart-define=VERSION_NAME=0.1.${{ github.run_number }} 2>&1 | tee ../build.log
      - name: Sign APK
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          exec > >(tee ../sign.log) 2>&1
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::KEYSTORE_B64 secret missing - skipping signing and release"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > /tmp/release.jks
          echo "keystore bytes: $(wc -c < /tmp/release.jks), password length: ${#KEYSTORE_PASSWORD}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          # Accept either the bare password or the whole README text that contains "KEYSTORE_PASSWORD = <pw>"
          PW_LINE=$(printf '%s\n' "$KEYSTORE_PASSWORD" | grep -oE 'KEYSTORE_PASSWORD *= *[A-Za-z0-9_-]+' | head -1 | sed -E 's/.*= *//')
          if [ -n "$PW_LINE" ]; then KEYSTORE_PASSWORD="$PW_LINE"; fi
          export KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n ')"
          echo "password length after cleanup: ${#KEYSTORE_PASSWORD}"
          OUT=build/app/outputs/flutter-apk
          "$APKSIGNER" sign --ks /tmp/release.jks --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias ramisales --out "$OUT/rami-sales.apk" "$OUT/app-release.apk"
          "$APKSIGNER" verify --print-certs "$OUT/rami-sales.apk" | head -3
          rm /tmp/release.jks
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.1.${{ github.run_number }}
          gh release create "$TAG" build/app/outputs/flutter-apk/rami-sales.apk \
            --title "מבצעי רמי $TAG" \
            --notes "גרסה $TAG · $(git log -1 --pretty=%s)" --latest
      - name: Publish logs on failure
        if: failure()
        working-directory: .
        run: |
          mkdir -p logs && cp -f analyze.log build.log sign.log logs/ 2>/dev/null || true
          cp app/android/app/src/main/AndroidManifest.xml logs/ 2>/dev/null || true
          cd logs && git init -q -b ci-logs
          git config user.name "rami-sales-bot"
          git config user.email "rami-sales-bot@users.noreply.github.com"
          git add -A && git commit -qm "ci logs ${{ github.run_number }}" && \
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build web
        run: |
          flutter create . --platforms=web --org com.bogoch --project-name rami_sales
          rm -rf test
          flutter build web --release --base-href /
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Screenshots
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          (cd build/web && python -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          mkdir -p ../shots
          python tool/screenshots.py http://localhost:8080/ ../shots
      - name: Publish screenshots
        if: always()
        working-directory: .
        run: |
          mkdir -p shots && cd shots && git init -q -b screenshots
          git config user.name "rami-sales-bot"
          git config user.email "rami-sales-bot@users.noreply.github.com"
          git add -A && git commit -qm "screenshots ${{ github.run_number }}" && \
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
