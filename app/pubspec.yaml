name: rami_sales
description: מבצעים טובים באמת ברמי לוי
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  geolocator: ^13.0.0
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  ota_update: ^7.1.0
  workmanager: ^0.10.0
  flutter_local_notifications: ^22.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
  adaptive_icon_background: assets/brand/icon-background.png
  adaptive_icon_foreground: assets/brand/icon-foreground.png
  adaptive_icon_monochrome: assets/brand/icon-monochrome.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/brand/icon-rounded.png
    background_color: "#D21F2C"
    theme_color: "#D21F2C"

flutter_native_splash:
  color: "#D21F2C"
  image: assets/brand/splash.png
  android_12:
    image: assets/brand/splash12.png
    color: "#D21F2C"
  web: false
